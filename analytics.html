<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Analytics - TaskFlow</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div
            class="d-md-none p-3 bg-white border-bottom d-flex justify-content-between align-items-center fixed-top">
            <h1 class="h5 fw-bold m-0 brand-name">TaskFlow</h1>
            <button
                class="btn btn-light"
                type="button"
                data-bs-toggle="offcanvas"
                data-bs-target="#sidebarMenu">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>

        <aside
            class="sidebar offcanvas-md offcanvas-start d-flex flex-column py-4"
            tabindex="-1"
            id="sidebarMenu">
            <div class="px-4 mb-4">
                <h1 class="h4 fw-bold brand-name mb-2">TaskFlow</h1>
                <div class="d-flex align-items-center text-muted small">
                    <i class="fa-solid fa-graduation-cap me-2"></i>
                    <span>Student</span>
                </div>
                <div class="small text-secondary fw-bold">Demo User</div>
            </div>
            <nav class="nav flex-column px-3 flex-grow-1">
                <a href="dashboard.html" class="nav-link"
                    ><i class="fa-solid fa-grip-vertical me-2 w-25px"></i>
                    Dashboard</a
                >
                <a href="tasks.html" class="nav-link"
                    ><i class="fa-solid fa-list-check me-2 w-25px"></i> Tasks</a
                >
                <a href="analytics.html" class="nav-link active"
                    ><i class="fa-solid fa-chart-line me-2 w-25px"></i>
                    Analytics</a
                >
                <a href="settings.html" class="nav-link"
                    ><i class="fa-solid fa-gear me-2 w-25px"></i> Settings</a
                >
            </nav>
            <div class="px-3 mt-auto">
                <a href="index.html" class="logout-link"
                    ><i class="fa-solid fa-arrow-right-from-bracket me-2"></i>
                    Logout</a
                >
            </div>
        </aside>

        <main class="content-area pt-5 pt-md-4">
            <header class="mb-4 pb-3 border-bottom">
                <h2 class="h3 fw-bold">Analytics</h2>
                <p class="text-muted small m-0">Sunday, January 18, 2026</p>
            </header>

            <div class="row g-4 mb-4">
                <div class="col-6 col-md-3">
                    <div class="card p-3 shadow-sm border-light h-100">
                        <label class="text-muted small mb-2">Total Tasks</label>
                        <div class="stat-number">2</div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="card p-3 shadow-sm border-light h-100">
                        <label class="text-muted small mb-2">Completed</label>
                        <div class="stat-number green">1</div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="card p-3 shadow-sm border-light h-100">
                        <label class="text-muted small mb-2">In Progress</label>
                        <div class="stat-number blue">1</div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="card p-3 shadow-sm border-light h-100">
                        <label class="text-muted small mb-2">Time Spent</label>
                        <div class="stat-number">2h</div>
                    </div>
                </div>
            </div>

            <div class="row g-4">
                <div class="col-md-6">
                    <div class="card p-4 shadow-sm border-light h-100">
                        <div class="mb-4">
                            <h3 class="h6 fw-bold m-0">Tasks Completed</h3>
                            <p class="small text-muted m-0">Weekly overview</p>
                        </div>
                        <div class="chart-area">
                            <div class="grid-line"><span>4</span></div>
                            <div class="grid-line"><span>3</span></div>
                            <div class="grid-line"><span>2</span></div>
                            <div class="grid-line"><span>1</span></div>
                            <div class="grid-line"><span>0</span></div>
                            <div
                                class="d-flex justify-content-between pt-2 small text-muted ms-1">
                                <span>S</span><span>M</span><span>T</span
                                ><span>W</span><span>T</span><span>F</span
                                ><span>S</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="card p-4 shadow-sm border-light h-100">
                        <div class="mb-4">
                            <h3 class="h6 fw-bold m-0">Productivity</h3>
                            <p class="small text-muted m-0">
                                Time of day analysis
                            </p>
                        </div>
                        <div class="chart-area">
                            <div class="grid-line"><span>4</span></div>
                            <div class="grid-line"><span>3</span></div>
                            <div class="grid-line"><span>2</span></div>
                            <div class="grid-line"><span>1</span></div>
                            <div class="grid-line"><span>0</span></div>
                            <div
                                class="d-flex justify-content-around pt-2 small text-muted">
                                <span>Afternoon</span><span>Night</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div
                        class="card p-4 shadow-sm border-light h-100 text-center">
                        <h3 class="h6 fw-bold mb-1">Categories</h3>
                        <p class="small text-muted mb-4">Task breakdown</p>
                        <div class="pie-chart-circle"></div>
                        <span class="text-primary fw-bold small"
                            >Assignment: 100%</span
                        >
                    </div>
                </div>
            </div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
