<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Settings - TaskFlow</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div
            class="d-md-none p-3 bg-white border-bottom d-flex justify-content-between align-items-center fixed-top">
            <h1 class="h5 fw-bold m-0 brand-name">TaskFlow</h1>
            <button
                class="btn btn-light"
                type="button"
                data-bs-toggle="offcanvas"
                data-bs-target="#sidebarMenu">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>

        <aside
            class="sidebar offcanvas-md offcanvas-start d-flex flex-column py-4"
            tabindex="-1"
            id="sidebarMenu">
            <div class="px-4 mb-4">
                <h1 class="h4 fw-bold brand-name mb-2">TaskFlow</h1>
                <div class="d-flex align-items-center text-muted small">
                    <i class="fa-solid fa-graduation-cap me-2"></i>
                    <span>Student</span>
                </div>
                <div class="small text-secondary fw-bold">Demo User</div>
            </div>
            <nav class="nav flex-column px-3 flex-grow-1">
                <a href="dashboard.html" class="nav-link"
                    ><i class="fa-solid fa-grip-vertical me-2 w-25px"></i>
                    Dashboard</a
                >
                <a href="tasks.html" class="nav-link"
                    ><i class="fa-solid fa-list-check me-2 w-25px"></i> Tasks</a
                >
                <a href="analytics.html" class="nav-link"
                    ><i class="fa-solid fa-chart-line me-2 w-25px"></i>
                    Analytics</a
                >
                <a href="settings.html" class="nav-link active"
                    ><i class="fa-solid fa-gear me-2 w-25px"></i> Settings</a
                >
            </nav>
            <div class="px-3 mt-auto">
                <a href="index.html" class="logout-link"
                    ><i class="fa-solid fa-arrow-right-from-bracket me-2"></i>
                    Logout</a
                >
            </div>
        </aside>

        <main class="content-area pt-5 pt-md-4">
            <header class="mb-4 pb-3 border-bottom">
                <h2 class="h3 fw-bold">Settings</h2>
                <p class="text-muted small m-0">Sunday, January 18, 2026</p>
            </header>

            <div
                class="card border-light shadow-sm p-4"
                style="max-width: 800px">
                <div class="mb-4">
                    <h3 class="h5 fw-bold mb-1">Profile Settings</h3>
                    <p class="text-muted small m-0">
                        Manage your personal information
                    </p>
                </div>

                <form>
                    <div class="mb-3">
                        <label class="form-label fw-bold small"
                            ><i class="fa-regular fa-user me-2 text-muted"></i>
                            Full Name</label
                        >
                        <input
                            type="text"
                            class="form-control bg-light border-0 py-2"
                            value="Demo User" />
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold small"
                            ><i
                                class="fa-regular fa-envelope me-2 text-muted"></i>
                            Email</label
                        >
                        <input
                            type="email"
                            class="form-control bg-light border-0 py-2"
                            value="eee@rr.vv" />
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold small"
                            ><i class="fa-regular fa-clock me-2 text-muted"></i>
                            Peak Energy Time</label
                        >
                        <select class="form-select bg-light border-0 py-2">
                            <option>Morning Person (6 AM - 12 PM)</option>
                            <option>Afternoon Person (12 PM - 5 PM)</option>
                            <option>Night Owl (8 PM - 2 AM)</option>
                        </select>
                        <p class="form-text small">
                            This helps us recommend the best times for your
                            tasks
                        </p>
                    </div>

                    <button
                        type="button"
                        class="btn bg-primary-custom fw-bold px-4">
                        Save Changes
                    </button>
                </form>
            </div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
