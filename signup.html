<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Sign Up - TaskFlow</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body class="d-flex align-items-center justify-content-center min-vh-100">
        <div style="width: 100%; max-width: 500px" class="p-3">
            <a
                href="index.html"
                class="text-decoration-none fw-bold text-primary mb-3 d-block">
                <i class="fa-solid fa-arrow-left me-2"></i> Back to role
                selection
            </a>

            <div class="card border-0 shadow-sm p-4 p-md-5 rounded-4">
                <div class="mb-4">
                    <h2 class="h3 fw-bold">Create an Account</h2>
                    <p class="text-muted">
                        Join TaskFlow to optimize your productivity
                    </p>
                </div>

                <form action="dashboard.html">
                    <div class="mb-3">
                        <label class="form-label fw-bold small"
                            >Full Name</label
                        >
                        <input
                            type="text"
                            class="form-control bg-light border-0 py-2"
                            placeholder="Name"
                            required />
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold small">Email</label>
                        <input
                            type="email"
                            class="form-control bg-light border-0 py-2"
                            placeholder="you@example.com"
                            required />
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold small">Password</label>
                        <input
                            type="password"
                            class="form-control bg-light border-0 py-2"
                            placeholder="••••••••"
                            required />
                    </div>

                    <button
                        type="submit"
                        class="btn bg-primary-custom w-100 py-2 fw-bold">
                        Sign Up
                    </button>
                </form>

                <div class="mt-4 text-center text-muted small">
                    Already have an account?
                    <a href="login.html" class="text-decoration-none">Log in</a>
                </div>
            </div>
        </div>
    </body>
</html>
